apiVersion: v1
kind: Service
metadata:
  name: {{ include "kube-siesta.fullname" . }}
  labels:
    {{- include "kube-siesta.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "kube-siesta.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
