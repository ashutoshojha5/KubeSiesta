<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KubeSiesta · {{ settings.cluster_name }}</title>
  {% block scripts %}{% endblock %}
  <style>
    :root { --fg:#1d2330; --muted:#667085; --bg:#f7f8fa; --card:#fff; --line:#e4e7ec;
            --ok:#12805c; --warn:#b54708; --off:#667085; --accent:#2f5bd3; --danger:#c4320a; }
    @media (prefers-color-scheme: dark) {
      :root { --fg:#e6e8ec; --muted:#98a2b3; --bg:#12151b; --card:#1a1e26; --line:#2c323d;
              --ok:#3ccf91; --warn:#f79009; --off:#98a2b3; --accent:#7a9cff; --danger:#f97066; }
    }
    * { box-sizing: border-box; }
    body { margin:0; font:14px/1.45 system-ui, sans-serif; color:var(--fg); background:var(--bg); }
    header { display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between;
             padding:14px 20px; border-bottom:1px solid var(--line); background:var(--card); }
    header h1 { font-size:17px; margin:0; }
    main { max-width:1100px; margin:0 auto; padding:16px; display:grid; gap:16px; }
    section { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:14px 16px; overflow-x:auto; }
    h2 { font-size:15px; margin:0 0 10px; display:flex; justify-content:space-between; align-items:center; gap:8px; }
    table { width:100%; border-collapse:collapse; }
    th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); white-space:nowrap; }
    th { color:var(--muted); font-weight:500; font-size:12px; }
    .muted { color:var(--muted); font-size:12px; }
    .pill { display:inline-block; padding:1px 8px; border-radius:10px; font-size:12px; border:1px solid currentColor; }
    .awake { color:var(--ok); } .asleep { color:var(--off); } .partial { color:var(--warn); }
    .empty { color:var(--off); } .failed { color:var(--danger); } .running { color:var(--accent); }
    button { font:inherit; padding:3px 10px; border-radius:6px; border:1px solid var(--line);
             background:var(--bg); color:var(--fg); cursor:pointer; }
    button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
    input[type=number] { width:56px; font:inherit; padding:2px 4px; background:var(--bg); color:var(--fg);
             border:1px solid var(--line); border-radius:4px; }
    input[type=text] { font:inherit; padding:3px 6px; background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:4px; }
    form.inline { display:inline-flex; gap:4px; align-items:center; margin:0; }
    .banner { padding:8px 12px; border-radius:6px; border:1px solid var(--warn); color:var(--warn); }
    .queued { color:var(--accent); font-size:12px; }
    tr.detail td { background:var(--bg); white-space:normal; }
    .center { min-height:100vh; display:grid; place-items:center; padding:16px; }
    .card { width:100%; max-width:380px; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:24px; }
    .card h1 { font-size:18px; margin:0 0 6px; }
    .card p { margin:0 0 16px; }
    .card input[type=text] { width:100%; padding:8px 10px; font-size:15px; margin-bottom:12px; }
    .card button { width:100%; padding:8px; }
    .error { color:var(--danger); font-size:13px; margin:-6px 0 10px; }
    button.info { width:22px; height:22px; padding:0; border-radius:50%; font:italic 600 12px/1 serif; color:var(--accent); }
    button.info[aria-expanded=true] { background:var(--accent); color:#fff; border-color:var(--accent); }
    tr[hidden] { display:none; }
    button.link { border:none; background:none; color:var(--accent); padding:0; }
  </style>
</head>
{% block body %}{% endblock %}
</html>
